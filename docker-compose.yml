version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school_api
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    env_file:
      - .env
    environment:
      - PORT=4000
      - PRISMA_RUN_MIGRATIONS=${PRISMA_RUN_MIGRATIONS:-true}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_PREFIX=${REDIS_PREFIX:-school_api}
      - REDIS_DB=${REDIS_DB:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - school_api_uploads:/app/uploads
    networks:
      - school_network

  redis:
    image: redis:7-alpine
    container_name: school_api_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - school_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: school_api_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-yhankoeduca}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yhankoeduca"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - school_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: school_api_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@yhankoeduca.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - school_network

volumes:
  postgres_data:
  school_api_uploads:
  redis_data:

networks:
  school_network:
    driver: bridge
